<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EatSafe AI - Analyze food ingredients for safety and allergens">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EatSafe AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EatSafe AI</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      color: white;
      transition: opacity 0.4s ease-in-out;
    }
    .splash.remove {
      opacity: 0;
    }
    .splash-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }
    .splash-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .splash-subtitle {
      font-size: 16px;
      opacity: 0.9;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-icon">🥗</div>
    <div class="splash-title">EatSafe AI</div>
    <div class="splash-subtitle">Analyzing food ingredients for your safety</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      window.setTimeout(function() {
        var splash = document.getElementById('splash');
        splash.classList.add('remove');
        window.setTimeout(function() {
          splash.remove();
        }, 400);
      }, 1500);
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
